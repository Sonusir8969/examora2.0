      font-weight: 600;

      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;

    .chapter-link:hover {

      color: #1e40af;
    }

      font-size: 0.7rem;
      background: #e6f0ff;
      padding: 2px 10px;
      border-radius: 20px;
      color: #1e4a76;
    }

      background: #0f2b3d;
      color: #cddfe7;
      padding: 40px 0 20px;
      margin-top: 40px;
    }

    .footer-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 30px;
      margin-bottom: 30px;
    }

    .footer-col a {
      display: block;
      color: #cbd5e1;
      text-decoration: none;
      margin: 8px 0;
      font-size: 0.85rem;
      transition: color 0.2s;

    .footer-col a:hover {

      border-top: 1px solid #2d4a6e;

        padding: 10px;

        padding: 8px 16px;
        border-radius: 40px;
        border-left: none;
        background: #f1f5f9;
        display: inline-block;
      }
      .subject-link.active {
        background: #1e4a76;
        color: white;
      }
      .chapter-row {
        flex-wrap: wrap;
        gap: 8px;
      }

    hindi: { name: "Hindi", chapters: hindiChapters },
    social: { name: "Social Science", chapters: socialChapters }
  };

  function renderChapters(subjectKey) {
    const subject = subjects[subjectKey];
    if (!subject) return;
    
    document.getElementById("subTitle").textContent = subject.name;
    
    let html = "";
    subject.chapters.forEach(function(ch) {
      html += `
        <div class="chapter-row">
          <div class="chapter-num">${ch.num}</div>
          <a href="${ch.link}" class="chapter-link">${ch.name}</a>
          <div class="test-badge">test</div>
        </div>
      `;
    });
    
    document.getElementById("chapterList").innerHTML = html;
  }

  document.querySelectorAll(".subject-link").forEach(function(item) {
    item.addEventListener("click", function(e) {
      e.preventDefault();
      document.querySelectorAll(".subject-link").forEach(function(s) {
        s.classList.remove("active");
      });
      this.classList.add("active");
      const subject = this.getAttribute("data-sub");
      renderChapters(subject);
    });
  });

  renderChapters("science");
