      color: #1e4a76;

      background: white;

      overflow: hidden;
      margin-bottom: 40px;

      color: #1e4a76;
      font-size: 1.4rem;

    .chapter-list {
      padding: 10px 0;

      align-items: center;
      padding: 10px 22px;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.2s;
    }

    .chapter-row:hover {
      background: #f8fafc;
    }

    .chapter-num {

      font-weight: 600;
      color: #555;
      font-size: 0.85rem;
    }

    .chapter-link {
      flex: 1;
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 0;

    .chapter-link:hover {
      text-decoration: underline;
      color: #1e40af;

      background: #e6f0ff;
      padding: 4px 14px;
      border-radius: 20px;
      color: #1e4a76;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;

      background: #1e4a76;
      color: white;

      color: #cddfe7;
      padding: 40px 0 20px;
      margin-top: 40px;
    }

    .footer-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 30px;
      margin-bottom: 30px;

      color: #cbd5e1;
      text-decoration: none;
      margin: 8px 0;
      font-size: 0.85rem;
      transition: color 0.2s;

    .footer-col a:hover {

      border-top: 1px solid #2d4a6e;
      padding-top: 20px;
      font-size: 0.75rem;

        width: 100%;
        position: relative;

        flex-wrap: wrap;
        gap: 8px;
        padding: 10px;
      }
      .subject-item {

        border-radius: 40px;
        border-left: none;
        background: #f1f5f9;
      }
      .subject-item.active {
        background: #1e4a76;
        color: white;
      }
      .chapter-row {

  function renderChapters(subject) {
    const data = chaptersData[subject];
    if (!data) return;
    document.getElementById("subTitle").textContent = data.name;

    let html = "";
    for (let i = 0; i < data.list.length; i++) {
      const ch = data.list[i];
      html += `
        <div class="chapter-row">
          <div class="chapter-num">${ch.num}</div>
          <a href="${ch.link}" class="chapter-link" target="_blank">${ch.name}</a>
          <a href="${ch.link}" class="test-badge" target="_blank">Test</a>
        </div>
      `;
    }
    document.getElementById("chapterList").innerHTML = html;
  }

  document.querySelectorAll(".subject-item").forEach(function(item) {

      document.querySelectorAll(".subject-item").forEach(function(s) {
        s.classList.remove("active");
      });
      this.classList.add("active");
      const subject = this.getAttribute("data-sub");
      renderChapters(subject);
    });
