      display: inline-block;

    .chapter-row:hover {
      background: #f8fafc;
    }

    .chapter-num {
      width: 80px;
      font-weight: 600;
      color: #555;
      font-size: 0.85rem;
    }

    .chapter-link {
      flex: 1;
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 0;
    }

    .chapter-link:hover {
      text-decoration: underline;
      color: #1e40af;
    }

    .test-badge {
      font-size: 0.7rem;
      background: #e6f0ff;
      padding: 4px 14px;

      justify-content: space-between;

    .footer-col a {
      display: block;
      color: #cbd5e1;
      text-decoration: none;
      margin: 8px 0;
      font-size: 0.85rem;
      transition: color 0.2s;
    }

    .footer-col a:hover {
      color: white;
    }

    .copyright {
      text-align: center;
      border-top: 1px solid #2d4a6e;
      padding-top: 20px;
      font-size: 0.75rem;
    }

    @media (max-width: 600px) {
      .chapter-row {
        flex-wrap: wrap;
        gap: 8px;
      }
      .chapter-num {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="container">

<footer>

  </div>
</footer>

<script>
  // Class 10 JAC Board Social Science Syllabus - Based on NCERT/JAC Curriculum
  const socialChapters = [
    // History (0 to 2)
    { num: "History-1", name: "The Rise of Nationalism in Europe", link: "the rise of nationalism.html" },
    { num: "History-2", name: "Nationalism in India", link: "nationalism in india.html" },
    { num: "History-3", name: "The Making of a Global World", link: "making of global world.html" },
    
    // Geography (3 to 7)
    { num: "Geo-1", name: "Resources and Development", link: "resources and deplopment.html" },
    { num: "Geo-2", name: "Forest and Wildlife Resources", link: "forest and wild life.html" },
    { num: "Geo-3", name: "Water Resources", link: "water resourcess.html" },
    { num: "Geo-4", name: "Agriculture", link: "agriculture.html" },
    { num: "Geo-5", name: "Minerals and Energy Resources", link: "mineral and energy.html" },
    
    // Civics / Political Science (8 to 11)
    { num: "Civics-1", name: "Power Sharing", link: "power sharing.html" },
    { num: "Civics-2", name: "Democracy and Diversity", link: "democracy and diversity.html" },
    { num: "Civics-3", name: "Political Parties", link: "political parties.html" },
    { num: "Civics-4", name: "Outcomes of Democracy", link: "outcomes of democracy.html" },
    
    // Economics (12 to 14)
    { num: "Eco-1", name: "Development", link: "deplopment.html" },
    { num: "Eco-2", name: "Sectors of the Indian Economy", link: "sectors of indian economy.html" },
    { num: "Eco-3", name: "Money and Credit", link: "money and credit.html" },
  ];

  function renderChapters() {
    let html = "";
    
    // Sections array mapped directly to socialChapters indices
    const sections = [
      { label: "History (India and the Contemporary World - II)", start: 0, end: 2 },
      { label: "Geography (Contemporary India - II)", start: 3, end: 7 },
      { label: "Civics / Political Science (Democratic Politics - II)", start: 8, end: 11 },
      { label: "Economics (Understanding Economic Development)", start: 12, end: 14 }
    ];

    for (let s = 0; s < sections.length; s++) {
      const section = sections[s];
      html += `<div class="section-label">${section.label}</div>`;
      
      for (let i = section.start; i <= section.end; i++) {
        const ch = socialChapters[i];
        if (!ch) continue;
        html += `
          <div class="chapter-row">
            <div class="chapter-num">${ch.num}</div>
            <a href="${ch.link}" class="chapter-link">${ch.name}</a>
            <a href="${ch.link}" class="test-badge">Test</a>
          </div>
        `;
      }
    }
    
    document.getElementById("chapterList").innerHTML = html;
  }

  renderChapters();
</script>
</body>
