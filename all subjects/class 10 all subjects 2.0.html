<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examora | Class 10 NCERT</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      color: #1e2a3e;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .header {
      background: white;
      padding: 20px 0;
      border-bottom: 2px solid #1e4a76;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 1.8rem;
      color: #1e4a76;
    }

    .header span {
      color: #2f855a;
    }

    .back-link {
      display: inline-block;
      margin-top: 10px;
      color: #1e4a76;
      text-decoration: none;
      font-size: 0.85rem;
    }
    .back-link:hover {
      text-decoration: underline;
    }

    .row {
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
    }

    .sidebar {
      width: 260px;
      background: white;
      border-radius: 16px;
      padding: 15px 0;
      border: 1px solid #ddd;
      height: fit-content;
      position: sticky;
      top: 20px;
    }

    .sidebar h3 {
      padding: 0 18px 12px 18px;
      border-bottom: 1px solid #eee;
      color: #1e4a76;
    }

    .subject-item {
      padding: 12px 18px;
      font-weight: 500;
      color: #1e2a3e;
      border-left: 3px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }

    .subject-item:hover {
      background: #eef2ff;
    }

    .subject-item.active {
      background: #eef2ff;
      border-left-color: #1e4a76;
      color: #1e4a76;
    }

    .content {
      flex: 1;
      background: white;
      border-radius: 16px;
      border: 1px solid #ddd;
      overflow: hidden;
      margin-bottom: 40px;
    }

    .content-header {
      background: #f8fafc;
      padding: 18px 22px;
      border-bottom: 1px solid #eee;
    }

    .content-header h2 {
      color: #1e4a76;
      font-size: 1.4rem;
    }

    .chapter-list {
      padding: 10px 0;
    }

    .chapter-row {
      display: flex;
      align-items: center;
      padding: 10px 22px;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.2s;
    }

    .chapter-row:hover {
      background: #f8fafc;
    }

    .chapter-num {
      width: 65px;
      font-weight: 600;
      color: #555;
      font-size: 0.85rem;
    }

    .chapter-link {
      flex: 1;
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 0;
    }

    .chapter-link:hover {
      text-decoration: underline;
      color: #1e40af;
    }

    .test-badge {
      font-size: 0.7rem;
      background: #e6f0ff;
      padding: 4px 14px;
      border-radius: 20px;
      color: #1e4a76;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }

    .test-badge:hover {
      background: #1e4a76;
      color: white;
    }

    footer {
      background: #0f2b3d;
      color: #cddfe7;
      padding: 40px 0 20px;
      margin-top: 40px;
    }

    .footer-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 30px;
      margin-bottom: 30px;
    }

    .footer-col a {
      display: block;
      color: #cbd5e1;
      text-decoration: none;
      margin: 8px 0;
      font-size: 0.85rem;
      transition: color 0.2s;
    }

    .footer-col a:hover {
      color: white;
    }

    .copyright {
      text-align: center;
      border-top: 1px solid #2d4a6e;
      padding-top: 20px;
      font-size: 0.75rem;
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 100%;
        position: relative;
      }
      .subject-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px;
      }
      .subject-item {
        padding: 8px 16px;
        border-radius: 40px;
        border-left: none;
        background: #f1f5f9;
      }
      .subject-item.active {
        background: #1e4a76;
        color: white;
      }
      .chapter-row {
        flex-wrap: wrap;
        gap: 8px;
      }
      .chapter-num {
        width: 100%;
      }
    }

</head>

  // Function to render chapters cleanly
  function renderChapters(subject) {
    const data = chaptersData[subject];
    if (!data) return;
    document.getElementById("subTitle").textContent = data.name;

    let html = "";
    for (let i = 0; i < data.list.length; i++) {
      const ch = data.list[i];
      html += `
        <div class="chapter-row">
          <div class="chapter-num">${ch.num}</div>
          <a href="${ch.link}" class="chapter-link" target="_blank">${ch.name}</a>
          <a href="${ch.link}" class="test-badge" target="_blank">MCQ</a>
        </div>
      `;
    }
    document.getElementById("chapterList").innerHTML = html;
  }

  // Handle subject tab clicks
  document.querySelectorAll(".subject-item").forEach(function(item) {
    item.addEventListener("click", function() {
      document.querySelectorAll(".subject-item").forEach(function(s) {
        s.classList.remove("active");
      });
      this.classList.add("active");
      const subject = this.getAttribute("data-sub");
      renderChapters(subject);
    });
  });

  // Load Science chapters by default
  renderChapters("science");
</script>
